name: Build AAB & APK

on:
  push:
    branches: [ main, master ]
  # APK untuk test manual di perangkat: AAB tidak bisa di-sideload, dan tanpa
  # trigger ini branch/PR tidak pernah menghasilkan artifact sama sekali.
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        env:
          VITE_REVENUECAT_API_KEY_ANDROID: ${{ secrets.REVENUECAT_API_KEY_ANDROID }}
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTOREBASE64 }}" | base64 --decode > android/app/financeapp-release.keystore

      # assembleRelease dipakai bersama bundleRelease: keduanya memakai buildType
      # release yang sama (minifyEnabled false, signingConfig dari env di
      # app/build.gradle), jadi APK yang keluar berperilaku sama dengan AAB rilis
      # — bedanya APK bisa langsung di-install ke perangkat untuk test.
      - name: Build AAB + APK (signed release)
        env:
          KEYSTORE_PATH: financeapp-release.keystore
          KEYSTOREPASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYPASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/financeapp-release.keystore

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Artifact inilah yang di-download untuk test manual di HP.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
